name: Publicar en GitHub Pages

# Se ejecuta solo, cada vez que subes cambios a la rama "main"
on:
  push:
    branches: [main]
  workflow_dispatch: # también permite lanzarlo manualmente desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
       

      - name: Instalar dependencias
        run: npm install

      - name: Compilar el sitio (build)
        env:
          # Estas dos claves se leen de "Settings > Secrets and variables > Actions" del repo,
          # NUNCA se escriben aquí directamente.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          # Le dice a Next.js el sub-camino real, según el nombre de este repositorio
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio ya compilado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
